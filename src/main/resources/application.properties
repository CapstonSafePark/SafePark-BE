spring.application.name=safepark

# Server Port
server.port=8080

# AWS RDS PostgreSQL Database
spring.datasource.url=jdbc:postgresql://safepark-db.cxeyyu40cbjx.ap-northeast-2.rds.amazonaws.com:5432/safepark
