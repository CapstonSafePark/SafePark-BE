spring.application.name=safepark
# Server Port
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/safepark_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.safepark=DEBUG

# JWT Settings

# JWT 서명에 사용할 비밀키
# 최소 32자 이상 (보안)
jwt.secret=safeparkSecretKeyForJwtTokenGenerationAndValidation2024!@#
# Access Token 유효기간 (1시간 = 3600000ms)
jwt.access-token-validity=3600000
# Refresh Token 유효기간 (7일 = 604800000ms)
jwt.refresh-token-validity=604800000